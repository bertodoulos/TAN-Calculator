name: Build Mac Application

# This allows you to trigger the build manually with a button click
on:
  workflow_dispatch: 

jobs:
  build:
    # This tells GitHub to rent a Mac server for this job
    runs-on: macos-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Stable version for math libraries

      - name: Install required libraries
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib scipy pyinstaller

      - name: Build the Mac App with PyInstaller
        run: |
          pyinstaller --windowed --onefile --clean --name "BioOil_TAN_Analyzer" TAN_Calculator_1_0.py

      - name: Zip the App Bundle (This preserves the Mac structure)
        run: |
          cd dist
          zip -r ../BioOil_TAN_Analyzer_Mac.zip BioOil_TAN_Analyzer.app

      - name: Upload the finished App
        uses: actions/upload-artifact@v4
        with:
          name: BioOil_TAN_Analyzer_Mac_Package
          path: BioOil_TAN_Analyzer_Mac.zip
